{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center align-items-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow border-0 p-5">

                <div class="text-center mb-4">

                    <i class="bi bi-person-plus-fill display-1 text-success"></i>

                    <h2 class="fw-bold mt-3">
                        Create Account
                    </h2>

                    <p class="text-muted">
                        Join Smart Grocery Advisor and start comparing grocery prices.
                    </p>

                </div>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            <i class="bi bi-person-fill text-success me-2"></i>
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control form-control-lg"
                            placeholder="Enter your full name"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            <i class="bi bi-envelope-fill text-success me-2"></i>
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control form-control-lg"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            <i class="bi bi-lock-fill text-success me-2"></i>
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control form-control-lg"
                            placeholder="Create a password"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="bi bi-telephone-fill text-success me-2"></i>
                            Phone Number
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control form-control-lg"
                            placeholder="Enter your phone number"
                            required>

                    </div>

                    <button class="btn btn-success btn-lg w-100">

                        <i class="bi bi-person-plus-fill me-2"></i>

                        Register

                    </button>

                </form>

                <hr>

                <p class="text-center mb-0">

                    Already have an account?

                    <a href="/login"
                       class="fw-bold text-decoration-none">

                        Login Here

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
