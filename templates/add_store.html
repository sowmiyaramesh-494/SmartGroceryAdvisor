{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center text-success mb-4">
                    Add Store
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <label>Store Name</label>
                        <input type="text"
                               name="store_name"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Location</label>
                        <input type="text"
                               name="location"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Contact Number</label>
                        <input type="text"
                               name="contact"
                               class="form-control"
                               required>
                    </div>

                    <button class="btn btn-success w-100">
                        Save Store
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
