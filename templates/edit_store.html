{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        Edit Store
    </h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Store Name</label>
            <input type="text"
                   name="store_name"
                   class="form-control"
                   value="{{ store[1] }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text"
                   name="location"
                   class="form-control"
                   value="{{ store[2] }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contact</label>
            <input type="text"
                   name="contact"
                   class="form-control"
                   value="{{ store[3] }}"
                   required>
        </div>

        <button type="submit" class="btn btn-success">
            Update Store
        </button>

        <a href="/view_stores" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
