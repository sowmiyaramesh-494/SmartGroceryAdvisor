{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        View Products
    </h2>

    <table class="table table-bordered table-hover">

        <thead class="table-success">

            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Brand</th>
            </tr>

        </thead>

        <tbody>

            {% for product in products %}

            <tr>

                <td>{{ product[0] }}</td>
                <td>{{ product[1] }}</td>
                <td>{{ product[2] }}</td>
                <td>{{ product[3] }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    <div class="text-center mt-4">

        <a href="/admin" class="btn btn-success">
            Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
