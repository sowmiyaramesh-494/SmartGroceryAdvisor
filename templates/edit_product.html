
{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        Edit Product
    </h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input
                type="text"
                name="product_name"
                class="form-control"
                value="{{ product[1] }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input
                type="text"
                name="category"
                class="form-control"
                value="{{ product[2] }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Brand</label>
            <input
                type="text"
                name="brand"
                class="form-control"
                value="{{ product[3] }}"
                required>
        </div>

        <button class="btn btn-success">
            Update Product
        </button>

        <a href="/view_products" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
