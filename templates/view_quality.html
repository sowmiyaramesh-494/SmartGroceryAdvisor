{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">

        <i class="bi bi-star-fill display-1 text-warning"></i>

        <h2 class="fw-bold mt-3">
            Quality Rating Management
        </h2>

        <p class="text-muted">
            View, edit and manage product quality ratings and remarks.
        </p>

    </div>

    <div class="card shadow border-0">

        <div class="card-body">

            <!-- Search -->

            <form method="GET" class="mb-4">

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-search"></i>

                    </span>

                    <input
                        type="text"
                        name="search"
                        class="form-control"
                        placeholder="Search by Product or Remarks..."
                        value="{{ search }}">

                    <button
                        class="btn btn-success"
                        type="submit">

                        Search

                    </button>

                </div>

            </form>

            <!-- Table -->

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-success">

                        <tr>

                            <th>
                                <i class="bi bi-box-seam me-2"></i>
                                Product
                            </th>

                            <th>
                                <i class="bi bi-star-half me-2"></i>
                                Quality
                            </th>

                            <th>
                                <i class="bi bi-chat-left-text-fill me-2"></i>
                                Remarks
                            </th>

                            <th class="text-center">
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for row in quality %}

                        <tr>

                            <td class="fw-semibold">

                                {{ row[0] }}

                            </td>

                            <td>

                                <span class="badge bg-success">

                                    ⭐ {{ row[1] }}/5

                                </span>

                            </td>

                            <td>

                                {{ row[2] }}

                            </td>

                            <td class="text-center">

                                <a href="/edit_quality/{{ row[3] }}"
                                   class="btn btn-warning btn-sm me-2">

                                    <i class="bi bi-pencil-square"></i>

                                    Edit

                                </a>

                                <a href="/delete_quality/{{ row[3] }}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Are you sure you want to delete this quality rating?')">

                                    <i class="bi bi-trash-fill"></i>

                                    Delete

                                </a>

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="/admin" class="btn btn-success btn-lg">

            <i class="bi bi-arrow-left-circle me-2"></i>

            Back to Dashboard

        </a>

    </div>

</div>

{% endblock %}
