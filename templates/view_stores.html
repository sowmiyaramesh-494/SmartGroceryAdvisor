{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        View Stores
    </h2>

    <table class="table table-bordered table-hover">

        <thead class="table-success">

            <tr>
                <th>Store ID</th>
                <th>Store Name</th>
                <th>Location</th>
                <th>Contact</th>
                 <th>Actions</th>
            </tr>

        </thead>

        <tbody>

            {% for store in stores %}

            <tr>

                <td>{{ store[0] }}</td>
                <td>{{ store[1] }}</td>
                <td>{{ store[2] }}</td>
                 <td>{{ store[3] }}</td>

            <td>

                <a href="/edit_store/{{ store[0] }}"
                    class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a href="/delete_store/{{ store[0] }}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('Are you sure you want to delete this store?')">
                    Delete
                </a>

            </td>

</tr>

            {% endfor %}

        </tbody>

    </table>

    <div class="text-center mt-4">

        <a href="/admin" class="btn btn-success">
            Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
