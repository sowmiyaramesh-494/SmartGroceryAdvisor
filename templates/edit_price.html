{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        Edit Price
    </h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Price (₹)</label>

            <input
                type="number"
                step="0.01"
                name="price"
                class="form-control"
                value="{{ price[3] }}"
                required>

        </div>

        <button class="btn btn-success">
            Update Price
        </button>

        <a href="/view_prices" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
