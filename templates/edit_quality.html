{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        Edit Quality Rating
    </h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Quality Score (1-5)</label>

            <input
                type="number"
                name="quality_score"
                min="1"
                max="5"
                class="form-control"
                value="{{ quality[2] }}"
                required>

        </div>

        <div class="mb-3">
            <label class="form-label">Remarks</label>

            <textarea
                name="remarks"
                class="form-control"
                rows="3"
                required>{{ quality[3] }}</textarea>

        </div>

        <button class="btn btn-success">
            Update Quality
        </button>

        <a href="/view_quality" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
