{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        View Product Prices
    </h2>

    <table class="table table-bordered table-hover">

        <thead class="table-success">

            <tr>
                <th>Product</th>
                <th>Store</th>
                <th>Price (₹)</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody>

            {% for row in prices %}

            <tr>

                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>₹ {{ row[2] }}</td>

                <td>

                    <a href="/edit_price/{{ row[3] }}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a href="/delete_price/{{ row[3] }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this price?')">
                        Delete
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    <div class="text-center mt-4">

        <a href="/admin" class="btn btn-success">
            Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
