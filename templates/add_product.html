{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center text-success mb-4">
                    Add Product
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <label>Product Name</label>
                        <input type="text"
                               name="product_name"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Category</label>
                        <input type="text"
                               name="category"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Brand</label>
                        <input type="text"
                               name="brand"
                               class="form-control"
                               required>
                    </div>

                    <button class="btn btn-success w-100">
                        Save Product
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
